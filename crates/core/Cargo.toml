[package]
name = "rhmsspm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lossless RHM (Rhythia) <-> SSPM (Sound Space+) map conversion"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
byteorder = "1"
thiserror = "2"

[dev-dependencies]
