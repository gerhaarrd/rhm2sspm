[package]
name = "rhm2sspm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Convert Rhythia .rhm maps to .sspm, preserving timing and off-grid (quantum) notes"

[[bin]]
name = "rhm2sspm"
path = "src/main.rs"

[dependencies]
rhmsspm-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anstream = "0.6"
owo-colors = "4"
anyhow = "1"
